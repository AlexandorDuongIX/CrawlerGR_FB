<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEO-BOT | FB Command Center</title>
  <meta name="description" content="Facebook Group Scraper - Command & Control Dashboard" />

  <!-- Fonts -->

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",

            "on-primary": "#00363a",
            "on-error": "#690005",
            "primary-fixed": "#7df4ff",

            "background": "#0b1326",

            "surface-container-highest": "#2d3449",
            "primary": "#dbfcff",
            "on-primary-container": "#006970",
            "on-error-container": "#ffdad6",
            "outline-variant": "#3b494b",
            "surface": "#0b1326",
            "surface-container-lowest": "#060e20",
            "on-primary-fixed-variant": "#004f54",
            "on-secondary-container": "#556d00",
            "on-surface-variant": "#b9cacb",
            "inverse-primary": "#006970",
            "on-secondary-fixed": "#161e00",
            "on-secondary-fixed-variant": "#3c4d00",
            "on-surface": "#dae2fd",
            "error": "#ffb4ab",
            "surface-glass": "rgba(30, 41, 59, 0.7)",
            "surface-container": "#171f33",
            "on-tertiary-fixed-variant": "#554500",
            "secondary": "#ffffff",
            "surface-variant": "#2d3449",
            "primary-fixed-dim": "#00dbe9",
            "surface-tint": "#00dbe9",
            "surface-deep": "#020617",
            "on-background": "#dae2fd",
            "status-stopped": "#EF4444",
            "surface-bright": "#31394d",
            "text-muted": "#94A3B8",

            "error-container": "#93000a",
            "on-tertiary-fixed": "#231b00",
            "secondary-fixed": "#c3f400",
            "on-tertiary-container": "#715d00",
            "tertiary-container": "#fed639",
            "status-running": "#22C55E",
            "on-secondary": "#283500",
            "surface-container-low": "#131b2e",
            "secondary-container": "#c3f400",
            "surface-dim": "#0b1326",
            "surface-container-high": "#222a3d",

            "tertiary-fixed-dim": "#eac324"

          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
          spacing: {
            gutter: "24px",
            "stack-sm": "8px",
            "stack-md": "16px",
            "margin-mobile": "16px",
            "stack-lg": "32px",
            "container-max": "1440px"
          },
          fontFamily: {
            "label-bold": ["Inter"],
            "headline-sm": ["Montserrat"],
            "label-sm": ["Inter"],
            "body-lg": ["Inter"],
            "headline-lg": ["Montserrat"],
            "headline-md": ["Montserrat"],
            "headline-lg-mobile": ["Montserrat"],
            "body-md": ["Inter"]

          fontSize: {

            "label-sm": ["12px", { lineHeight: "1", fontWeight: "500" }],

            "body-md": ["14px", { lineHeight: "1.5", fontWeight: "400" }]

        }
      }
    }

  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="bg-surface font-body-md text-on-surface">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
